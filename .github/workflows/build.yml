name: FoliaSIMD Build

on:
  push:
    branches: [ "**" ]
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.patch"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.patch"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    # Avoid running the same internal PR twice (push + pull_request).
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FoliaSIMD
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git user
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build FoliaSIMD
        run: ./gradlew build --stacktrace

      - name: Upload FoliaSIMD JARs
        uses: actions/upload-artifact@v4
        with:
          name: FoliaSIMD-${{ github.sha }}
          path: |
            folia-server/build/libs/*.jar
            !folia-server/build/libs/*-sources.jar
            !folia-server/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
